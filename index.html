<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#0f1f0f"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<link rel="manifest" href="/GreenIdea-Maintenance/manifest.json"/>
<title>GI Maintenance</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --green:#1a6b2a;--green2:#22883a;--green-light:#e8f5eb;
  --red:#dc2626;--amber:#d97706;--blue:#2563eb;
  --bg:#f4f6f4;--surface:#fff;--border:#e5e7eb;--border2:#d1d5db;
  --text:#111;--muted:#6b7280;--font:'Inter',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;font-size:14px;}
.screen{display:none;flex-direction:column;min-height:100vh;}
.screen.active{display:flex;}

/* HEADER */
.app-header{background:var(--green);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:fixed;top:0;left:0;right:0;z-index:200;}
.app-header-spacer{height:56px;flex-shrink:0;}
.app-logo{font-weight:800;font-size:17px;color:#fff;letter-spacing:-0.5px;}
.app-logo span{color:#a8f0b8;}
.lang-toggle{background:rgba(255,255,255,0.15);border:none;color:#fff;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font);}

/* NAV */
.app-nav{background:var(--surface);border-bottom:2px solid var(--border);display:flex;position:fixed;top:56px;left:0;right:0;z-index:199;overflow-x:auto;}
.app-nav-spacer{height:46px;flex-shrink:0;}
.nav-btn{background:transparent;border:none;color:var(--muted);padding:10px 14px;font-family:var(--font);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;border-radius:0;border-bottom:3px solid transparent;transition:all .15s;}
.nav-btn.active{color:var(--green);border-bottom-color:var(--green);}
.body{flex:1;padding:16px;max-width:600px;margin:0 auto;width:100%;}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;}
.section-title{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.5px;margin-bottom:12px;text-transform:uppercase;}

/* STATUS BADGES */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;}
.badge.ok{background:#dcfce7;color:#16a34a;}
.badge.warn{background:#fef3c7;color:#d97706;}
.badge.due{background:#fee2e2;color:#dc2626;}
.badge.na{background:#f3f4f6;color:#6b7280;}

/* EQUIPMENT CARDS */
.equip-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:10px;}
.equip-header{padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;}
.equip-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.equip-icon.truck{background:#dbeafe;}
.equip-icon.machine{background:#fef3c7;}
.equip-icon.tool{background:#f3e8ff;}
.equip-photo-thumb{width:42px;height:42px;border-radius:10px;object-fit:cover;flex-shrink:0;cursor:pointer;border:2px solid var(--border);}
.photo-preview-wrap{position:relative;margin-bottom:8px;}
.photo-preview-img{width:100%;max-height:180px;object-fit:cover;border-radius:10px;display:block;}
.photo-remove-btn{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:26px;height:26px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.photo-input-label{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1.5px dashed var(--border2);border-radius:8px;cursor:pointer;font-size:13px;color:var(--muted);font-weight:600;}
.photo-input-label:active{background:#f9fafb;}
#modal-photo .modal{background:#111;padding:0;border-radius:18px;overflow:hidden;}
#modal-photo img{width:100%;display:block;border-radius:18px;}
#modal-photo .modal-actions{background:#111;padding:12px 16px;}
.equip-tasks{padding:0 16px 12px;}
.task-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--border);}
.task-info{flex:1;min-width:0;}
.task-name{font-weight:600;font-size:13px;}
.task-due{font-size:11px;color:var(--muted);margin-top:2px;}

/* FORMS */
.fg{margin-bottom:12px;}
.fg label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px;}
.fg input,.fg select,.fg textarea{width:100%;padding:10px 12px;border:1px solid var(--border2);border-radius:8px;font-size:14px;font-family:var(--font);background:#fff;color:var(--text);}
.fg textarea{resize:vertical;min-height:70px;}
.interval-toggle{display:flex;gap:6px;margin-bottom:8px;}
.interval-toggle button{flex:1;padding:8px;border:1px solid var(--border2);border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font);background:#fff;color:var(--muted);}
.interval-toggle button.active{background:var(--green);color:#fff;border-color:var(--green);}

/* BUTTONS */
.btn{padding:12px 20px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font);background:var(--green);color:#fff;}
.btn.sm{padding:6px 14px;font-size:12px;}
.btn.red{background:var(--red);}
.btn.ghost{background:transparent;border:1px solid var(--border2);color:var(--text);}
.btn.full{width:100%;}
.btn.amber{background:var(--amber);}

/* MODALS */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;align-items:flex-end;justify-content:center;padding:0;}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border-radius:20px 20px 0 0;padding:24px 20px 32px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;}
.modal-title{font-size:18px;font-weight:800;margin-bottom:18px;}
.modal-actions{display:flex;gap:10px;margin-top:16px;}
.modal-actions .btn{flex:1;}

/* CALENDAR */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:12px;}
.cal-day-header{text-align:center;font-size:10px;font-weight:700;color:var(--muted);padding:4px 0;}
.cal-day{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;cursor:pointer;position:relative;border:none;background:none;font-family:var(--font);color:var(--text);-webkit-appearance:none;appearance:none;padding:0;width:100%;}
.cal-day.today{background:var(--green);color:#fff;}
.cal-day.has-event::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--amber);}
.cal-day.today.has-event::after{background:#fff;}
.cal-day.other-month{color:#d1d5db;}
.cal-day:hover:not(.today){background:#f3f4f6;}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 20px;border-radius:99px;font-size:13px;font-weight:600;z-index:9999;display:none;white-space:nowrap;}

/* KPI GRID */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 12px;text-align:center;}
.kpi-val{font-size:28px;font-weight:800;font-family:var(--font);}
.kpi-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-top:3px;}

/* ALERT ITEMS */
.alert-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.alert-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.alert-dot.red{background:var(--red);}
.alert-dot.amber{background:var(--amber);}

/* LOGIN */
#screen-login{background:var(--green);align-items:center;justify-content:center;}
.login-box{background:#fff;border-radius:20px;padding:32px 28px;width:90%;max-width:360px;text-align:center;}
.login-logo{font-size:26px;font-weight:800;color:var(--green);margin-bottom:4px;}
.login-sub{color:var(--muted);font-size:12px;margin-bottom:24px;}
.login-box input{width:100%;padding:12px;border:1px solid var(--border2);border-radius:10px;font-size:14px;font-family:var(--font);margin-bottom:10px;box-sizing:border-box;}
#login-error{color:var(--red);font-size:12px;margin-bottom:8px;display:none;}

@media(max-width:400px){.body{padding:12px;}}
</style>
</head>

    <button class="nav-btn" data-tab="calendar" onclick="switchTab('calendar',this)">📅 <span class="t" data-en="Calendar" data-pt="Calendário">Calendar</span></button>
    <button class="nav-btn" data-tab="history" onclick="switchTab('history',this)">📋 <span class="t" data-en="History" data-pt="Histórico">History</span></button>

  <!-- DASHBOARD -->
  <div id="tab-dashboard" class="body">

      <button onclick="calNav(-1)" style="background:transparent;border:1px solid var(--border2);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:16px">‹</button>
      <div id="cal-title" style="font-size:16px;font-weight:800"></div>
      <button onclick="calNav(1)" style="background:transparent;border:1px solid var(--border2);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:16px">›</button>

    <div class="cal-grid" id="cal-grid"></div>

<!-- MODAL: ADD/EDIT TASK -->
<div id="modal-task" class="modal-overlay">
  <div class="modal">

      <button class="btn" onclick="saveTask()">✓ <span class="t" data-en="Save" data-pt="Salvar">Save</span></button>
      <button class="btn ghost" onclick="closeModal('modal-task')"><span class="t" data-en="Cancel" data-pt="Cancelar">Cancel</span></button>

</div>

<!-- MODAL: LOG MAINTENANCE -->

// ── STATE ──
var lang = localStorage.getItem('gi_lang') || 'en';

// ── LANG ──
function applyLang(){
  document.querySelectorAll('.t[data-'+lang+']').forEach(function(el){
    el.textContent = el.getAttribute('data-'+lang);
  });
  document.getElementById('lang-btn').textContent = lang==='en'?'PT':'EN';
  localStorage.setItem('gi_lang', lang);
}
function toggleLang(){ lang = lang==='en'?'pt':'en'; applyLang(); renderAll(); }
window.toggleLang = toggleLang;

function T(en, pt){ return lang==='pt' ? pt : en; }

// ── UTILS ──
function showToast(msg, type){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = type==='err'?'#dc2626':'#111';
  t.style.display = 'block';
  setTimeout(function(){ t.style.display='none'; }, 2500);
}
function closeModal(id){ document.getElementById(id).classList.remove('open'); }
window.closeModal = closeModal;

function localDateStr(d){
  var dt = d||new Date();
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
}
function parseLocalDate(str){
  if(!str) return new Date();
  var p = str.split('-');
  if(p.length===3) return new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));
  return new Date(str);
}
function fmtDate(str){ return parseLocalDate(str).toLocaleDateString(lang==='pt'?'pt-BR':'en-US',{month:'short',day:'numeric',year:'numeric'}); }
function daysDiff(dateStr){
  var d = parseLocalDate(dateStr);
  var now = new Date(); now.setHours(0,0,0,0);
  return Math.round((d-now)/(1000*60*60*24));
}
function addMonths(dateStr, months){
  var d = parseLocalDate(dateStr);
  d.setMonth(d.getMonth()+months);
  return localDateStr(d);
}

// ── TASK DUE DATE ──
function getTaskDueDate(task){
  if(!task.lastDone) return null;
  if(task.intervalType==='months' && task.intervalMonths){
    return addMonths(task.lastDone, task.intervalMonths);
  }
  return null; // hours-based: no auto date
}

function getTaskStatus(task){
  if(task.intervalType==='hours'){
    var eq = equipment.find(function(e){ return e.id===task.equipId; });
    if(!eq || eq.currentHours===undefined || eq.currentHours===null || task.lastDoneHours===undefined || task.lastDoneHours===null) return 'na';
    var hoursUsed = parseFloat(eq.currentHours) - parseFloat(task.lastDoneHours);
    var remaining = task.intervalHours - hoursUsed;
    if(remaining <= 0) return 'due';
    if(remaining <= 50) return 'warn';
    return 'ok';
  }
  var due = getTaskDueDate(task);
  if(!due) return 'na';
  var days = daysDiff(due);
  if(days < 0) return 'due';
  if(days <= 14) return 'warn';
  return 'ok';
}

function statusBadge(task){
  if(task.intervalType==='hours'){
    var eq = equipment.find(function(e){ return e.id===task.equipId; });
    if(!eq || eq.currentHours===undefined || eq.currentHours===null || task.lastDoneHours===undefined || task.lastDoneHours===null){
      return '<span class="badge na">'+T('Set hrs','Config hrs')+'</span>';
    }
    var hoursUsed = parseFloat(eq.currentHours) - parseFloat(task.lastDoneHours);
    var remaining = Math.round(task.intervalHours - hoursUsed);
    if(remaining <= 0) return '<span class="badge due">'+T('Overdue','Vencido')+' '+Math.abs(remaining)+'h</span>';
    if(remaining <= 50) return '<span class="badge warn">'+remaining+'h '+T('left','restante')+'</span>';
    return '<span class="badge ok">'+remaining+'h '+T('left','restante')+'</span>';
  }
  var due = getTaskDueDate(task);
  var status = getTaskStatus(task);
  if(status==='na') return '<span class="badge na">'+T('No date','Sem data')+'</span>';
  var days = daysDiff(due);
  if(status==='due') return '<span class="badge due">'+T('Overdue','Vencido')+' '+Math.abs(days)+'d</span>';
  if(status==='warn') return '<span class="badge warn">'+T('Due in','Vence em')+' '+days+'d</span>';
  return '<span class="badge ok">'+T('OK','OK')+'</span>';
}

function startApp(){
  currentUser = currentUser || JSON.parse(localStorage.getItem('gi_profile')||'{}');
  document.getElementById('header-user').textContent = currentUser.name||'';
  showScreen('app');
  applyLang();
  startListeners();

var _listenersStarted = false;
function startListeners(){
  if(_listenersStarted) return; _listenersStarted=true;
  db.collection('gi_equipment').orderBy('createdAt','asc').onSnapshot(function(s){
    equipment=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});
    renderAll();
    populateHistFilter();
  });
  db.collection('gi_tasks').orderBy('createdAt','asc').onSnapshot(function(s){
    tasks=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});
    renderAll();
  });
  db.collection('gi_logs').orderBy('date','desc').onSnapshot(function(s){
    logs=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});
    renderAll();
  });
}

}

// ── CALENDAR ──
function renderCalendar(){
  var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var monthsPt = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  document.getElementById('cal-title').textContent = (lang==='pt'?monthsPt[calMonth]:months[calMonth])+' '+calYear;
  var days = ['Su','Mo','Tu','We','Th','Fr','Sa'];
  var daysPt = ['Do','Se','Te','Qu','Qu','Se','Sá'];
  var hdrs = document.getElementById('cal-headers');
  hdrs.innerHTML = (lang==='pt'?daysPt:days).map(function(d){ return '<div class="cal-day-header">'+d+'</div>'; }).join('');
  var first = new Date(calYear,calMonth,1).getDay();
  var daysInMonth = new Date(calYear,calMonth+1,0).getDate();
  var daysInPrev = new Date(calYear,calMonth,0).getDate();
  var todayStr = localDateStr();
  // Build set of dates with logs
  var logDates = {};
  logs.forEach(function(l){ logDates[l.date]=1; });
  var grid = document.getElementById('cal-grid');
  var cells = '';
  for(var i=0;i<first;i++){
    var d2 = daysInPrev-first+1+i;
    cells += '<button class="cal-day other-month" disabled>'+d2+'</button>';
  }
  for(var d=1;d<=daysInMonth;d++){
    var dateStr = calYear+'-'+String(calMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var isToday = dateStr===todayStr;
    var hasLog = logDates[dateStr];
    cells += '<button class="cal-day'+(isToday?' today':'')+(hasLog?' has-event':'')+'" data-date="'+dateStr+'" onclick="calDayClick(this.dataset.date)">'+d+'</button>';
  }
  var remaining = 42 - first - daysInMonth;
  for(var n=1;n<=remaining;n++) cells += '<button class="cal-day other-month" disabled>'+n+'</button>';
  grid.innerHTML = cells;
}
function calNav(dir){ calMonth+=dir; if(calMonth>11){calMonth=0;calYear++;} if(calMonth<0){calMonth=11;calYear--;} renderCalendar(); }
window.calNav = calNav;

function handleEquipPhoto(input){
  if(!input.files||!input.files[0]) return;
  var file = input.files[0];
  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var canvas = document.createElement('canvas');
      var MAX = 800;
      var w = img.width, h = img.height;
      if(w>h){ if(w>MAX){h=Math.round(h*MAX/w);w=MAX;} } else { if(h>MAX){w=Math.round(w*MAX/h);h=MAX;} }
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      var b64 = canvas.toDataURL('image/jpeg',0.72);
      pendingEquipPhoto = b64;
      document.getElementById('eq-photo-img').src=b64;
      document.getElementById('eq-photo-preview').style.display='block';
      document.getElementById('eq-photo-label').style.display='none';
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
window.handleEquipPhoto = handleEquipPhoto;

  showToast(T('Saved!','Salvo!'));
}

  editingTaskId=taskId; editingTaskEquipId=equipId;
  document.getElementById('modal-task-title').textContent=T('Edit Task','Editar Tarefa');
  document.getElementById('tk-name').value=t.name||'';
  document.getElementById('tk-last').value=t.lastDone||localDateStr();
  document.getElementById('tk-notes').value=t.notes||'';
  setIntervalType(t.intervalType||'months');
  if(t.intervalType==='hours') document.getElementById('tk-hours').value=t.intervalHours||'';
  else document.getElementById('tk-months').value=t.intervalMonths||'';
  document.getElementById('modal-task').classList.add('open');
}
window.openEditTaskModal = openEditTaskModal;
function saveTask(){
  var name=document.getElementById('tk-name').value.trim();
  var last=document.getElementById('tk-last').value;
  var notes=document.getElementById('tk-notes').value.trim();
  if(!name) return showToast(T('Enter a task name','Insira o nome da tarefa'),'err');
  var data={name:name,equipId:editingTaskEquipId,intervalType:currentIntervalType,lastDone:last,notes:notes,updatedAt:new Date().toISOString(),updatedBy:currentUser?currentUser.name:'Admin'};
  if(currentIntervalType==='months'){
    var m=parseInt(document.getElementById('tk-months').value)||3;
    data.intervalMonths=m;
  } else {
    var h=parseInt(document.getElementById('tk-hours').value)||250;
    data.intervalHours=h;
  }
  if(editingTaskId){ db.collection('gi_tasks').doc(editingTaskId).update(data); }
  else { db.collection('gi_tasks').add(Object.assign(data,{createdAt:new Date().toISOString(),createdBy:currentUser?currentUser.name:'Admin'})); }
  closeModal('modal-task');
  showToast(T('Saved!','Salvo!'));
}
window.saveTask = saveTask;

// ── LOG MAINTENANCE ──
function openLogModal(equipId,taskId){
  loggingEquipId=equipId; loggingTaskId=taskId;
  document.getElementById('log-date').value=localDateStr();
  document.getElementById('log-hours').value='';
  document.getElementById('log-notes').value='';
  document.getElementById('modal-log').classList.add('open');
}
window.openLogModal = openLogModal;
function saveLog(){
  var date=document.getElementById('log-date').value;
  var hours=document.getElementById('log-hours').value;
  var notes=document.getElementById('log-notes').value.trim();
  if(!date) return showToast(T('Select a date','Selecione a data'),'err');
  var by = currentUser?currentUser.name:'Admin';
  db.collection('gi_logs').add({equipId:loggingEquipId,taskId:loggingTaskId,date:date,hours:hours||null,notes:notes,by:by,createdAt:new Date().toISOString()});
  // Update lastDone on task; also save lastDoneHours for hours-based tracking
  var taskUpdate = {lastDone:date,updatedAt:new Date().toISOString(),updatedBy:by};
  var loggedTask = tasks.find(function(t){ return t.id===loggingTaskId; });
  if(loggedTask && loggedTask.intervalType==='hours' && hours){
    taskUpdate.lastDoneHours = parseFloat(hours);
  }
  db.collection('gi_tasks').doc(loggingTaskId).update(taskUpdate);
  closeModal('modal-log');
  showToast(T('Logged! ✅','Registrado! ✅'));
}
window.saveLog = saveLog;

// ── DELETE ──
function promptDeleteTask(equipId,taskId){
  pendingDeleteType='task'; pendingDeleteId=taskId; pendingDeleteEquipId=equipId;
  document.getElementById('modal-delete-msg').textContent=T('Delete this task and all its logs?','Excluir esta tarefa e todos os registros?');
  document.getElementById('modal-delete').classList.add('open');
}
window.promptDeleteTask = promptDeleteTask;
function promptDeleteEquip(equipId){
  pendingDeleteType='equipment'; pendingDeleteId=equipId;
  document.getElementById('modal-delete-msg').textContent=T('Delete this equipment and ALL its tasks and logs? This cannot be undone.','Excluir este equipamento e TODAS as tarefas e registros? Isso não pode ser desfeito.');
  document.getElementById('modal-delete').classList.add('open');
}
window.promptDeleteEquip = promptDeleteEquip;
function promptDeleteLog(logId){
  pendingDeleteType='log'; pendingDeleteId=logId;
  document.getElementById('modal-delete-msg').textContent=T('Delete this log entry?','Excluir este registro?');
  document.getElementById('modal-delete').classList.add('open');
}
window.promptDeleteLog = promptDeleteLog;
function confirmDelete(){
  if(pendingDeleteType==='equipment'){
    var eqTasks = tasks.filter(function(t){ return t.equipId===pendingDeleteId; });
    eqTasks.forEach(function(t){
      logs.filter(function(l){ return l.taskId===t.id; }).forEach(function(l){
        db.collection('gi_logs').doc(l.id).delete();
      });
      db.collection('gi_tasks').doc(t.id).delete();
    });
    db.collection('gi_equipment').doc(pendingDeleteId).delete();
  } else if(pendingDeleteType==='task'){
    db.collection('gi_tasks').doc(pendingDeleteId).delete();
    logs.filter(function(l){return l.taskId===pendingDeleteId;}).forEach(function(l){ db.collection('gi_logs').doc(l.id).delete(); });
  } else if(pendingDeleteType==='log'){
    db.collection('gi_logs').doc(pendingDeleteId).delete();
  }
  closeModal('modal-delete');
  showToast(T('Deleted','Excluído'));
}
window.confirmDelete = confirmDelete;

// ── PUSH NOTIFICATIONS ──
function requestNotifPermission(){
  if('Notification' in window && Notification.permission==='default'){
    Notification.requestPermission();
  }
}
function checkNotifications(){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  tasks.forEach(function(t){
    var status=getTaskStatus(t);
    if(status==='due'||status==='warn'){
      var eq=equipment.find(function(e){return e.id===t.equipId;});
      var key='gi_notif_'+t.id+'_'+localDateStr();
      if(!localStorage.getItem(key)){
        var due=getTaskDueDate(t);
        var days=daysDiff(due);
        var msg=status==='due'?
          (eq?eq.name+': ':'')+t.name+' '+T('is overdue!','está vencido!'):
          (eq?eq.name+': ':'')+t.name+' '+T('due in','vence em')+' '+days+' '+T('days','dias');
        new Notification('GI Maintenance', {body:msg, icon:'/GreenIdea-Maintenance/icon-192.png'});
        localStorage.setItem(key,'1');
      }
    }
  });
}

// ── INIT ──
auth.onAuthStateChanged(function(user){
  if(user && localStorage.getItem('gi_session')==='admin'){
    startApp();
    setTimeout(function(){ requestNotifPermission(); checkNotifications(); }, 2000);
  } else {
    showScreen('login');
  }
});

// Wire photo label click for Android (label[for] may not fire on Samsung)
document.addEventListener('DOMContentLoaded', function(){
  var lbl = document.getElementById('eq-photo-label');
  if(lbl){
    lbl.addEventListener('click', function(){
      document.getElementById('eq-photo-input').click();
    });
  }
});
